<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b5bd6"><title>Lógica</title>
<style>
:root{--bg:#f6f6fb;--c:#fff;--t:#1c1c28;--s:#6b6b80;--p:#5b5bd6;--pl:#ececff;--ok:#1f9d63;--bad:#d64545;--ln:#e6e6f0}
@media(prefers-color-scheme:dark){:root{--bg:#10101a;--c:#1a1a28;--t:#f0f0fa;--s:#9a9ab4;--pl:#26264a;--ln:#2a2a3e}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t);padding-top:env(safe-area-inset-top)}
main{padding:16px 16px 100px;max-width:640px;margin:auto}
h1{font-size:28px}h2{font-size:18px;margin:16px 0 6px}.s{color:var(--s);font-size:14px}
.card{background:var(--c);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:10px 0}
button{font-family:inherit;cursor:pointer}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:600;font-size:16px;background:var(--p);color:#fff;margin-top:12px}
.btn.sec{background:var(--pl);color:var(--p)}
.opt{background:var(--c);color:var(--t);border:1.5px solid var(--ln);text-align:left;font-weight:500}
.opt.sel{border-color:var(--p);background:var(--pl)}.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--bad)}
textarea,input{width:100%;border:1.5px solid var(--ln);border-radius:12px;padding:12px;background:var(--bg);color:var(--t);font:inherit;margin-top:8px}
.bar{height:8px;background:var(--pl);border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--p);border-radius:8px}
.top{display:flex;gap:12px;align-items:center}.back{border:0;background:var(--pl);color:var(--p);border-radius:12px;width:40px;height:40px;font-size:20px}
.row{display:flex;gap:10px;align-items:center}.row>div{flex:1}.ico{font-size:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{border:1.5px solid var(--ln);background:var(--c);color:var(--t);border-radius:20px;padding:8px 14px}.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats .card{text-align:center;margin:0}.stats b{font-size:24px;color:var(--p)}
ul{padding-left:20px}li{margin:6px 0}table{width:100%;border-collapse:collapse;margin-top:10px;text-align:center}td,th{padding:6px;border-bottom:1px solid var(--ln)}
.g{color:var(--ok);font-weight:700}.r{color:var(--bad);font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--s);padding:10px 0;font-size:12px}nav button.on{color:var(--p);font-weight:700}nav span{display:block;font-size:22px}
</style></head><body><main></main>
<nav><button data-t=home onclick="go('home')"><span>🏠</span>Inicio</button><button data-t=map onclick="go('map')"><span>🗺️</span>Mapa</button><button data-t=lab onclick="go('lab')"><span>🧪</span>Lab</button><button data-t=prog onclick="go('prog')"><span>📊</span>Progreso</button></nav>
<script>
const M=[
{id:"fun",i:"🧩",n:"Fundamentos de lógica",c:"La lógica estudia cuándo una conclusión se sigue necesariamente de unas premisas.",d:["Premisa: afirmación de partida","Conclusión: lo que se quiere establecer","Inferencia: el paso que conecta ambas"],f:"Un argumento es válido si, siendo verdaderas las premisas, la conclusión no puede ser falsa. Validez (la forma) y verdad (el contenido) son cosas distintas.",e:["Cotidiano: «Hay nubes negras; si hay nubes negras llueve; luego llueve».","Abstracto: todo A es B; x es A; luego x es B."],
q:["Todos los gatos son mamíferos. Max es un gato. ¿Qué se sigue necesariamente?",["Max es mamífero","Max tiene cuatro patas","Todos los mamíferos son gatos"],0,["Max pertenece a un grupo incluido en «mamíferos».","Probable, pero no sale de las premisas dadas.","Invierte la relación: de «gatos ⊂ mamíferos» no sigue lo contrario."]],
p:["«Todas las aves vuelan. Los pingüinos son aves. Luego los pingüinos vuelan». ¿Qué falla?",["La forma es válida; la premisa 1 es falsa","La forma es inválida","Es sólido porque la conclusión suena razonable"],0,["La forma es correcta, pero una premisa falsa arruina la solidez.","La forma es idéntica al ejemplo de Max: válida.","Que suene razonable no prueba nada; revisa las premisas."]]},
{id:"pro",i:"🔣",n:"Lógica proposicional",c:"Una proposición es un enunciado verdadero o falso. Se combinan con conectivos: ¬ (no), ∧ (y), ∨ (o), → (si… entonces).",d:["Proposición simple: p, q","Conectivo: opera sobre valores de verdad","Tabla de verdad: todos los casos posibles"],f:"El valor de una expresión compuesta depende solo de los valores de sus partes. «p → q» solo es falsa cuando p es verdadera y q falsa.",e:["«Si llueve, llevo paraguas»: solo la rompes si llueve y no lo llevas.","Abstracto: (V → F) = F; (F → cualquiera) = V."],
q:["«Si llueve, llevo paraguas». Hoy no llueve y no llevo paraguas. ¿La frase es verdadera?",["Sí, no se viola","No, es falsa","No se puede saber"],0,["Solo se violaría si lloviera y no lo llevara.","Confundes «no se cumple el antecedente» con «se viola la regla».","Con los dos valores dados sí se puede decidir."]],
p:["Sabes que p → q es FALSA. ¿Qué valores tienen p y q?",["p verdadera, q falsa","p falsa, q verdadera","p falsa, q falsa"],0,["Es el único caso que rompe la condicional.","Con antecedente falso la condicional es verdadera.","Con antecedente falso la condicional es verdadera."]]},
{id:"ded",i:"⛓️",n:"Lógica deductiva",c:"Deducir es sacar conclusiones que se siguen con certeza de las premisas.",d:["Modus ponens: p→q, p ⊢ q","Modus tollens: p→q, ¬q ⊢ ¬p","Falacias formales: afirmar el consecuente, negar el antecedente"],f:"Si la forma es válida y las premisas son ciertas, la conclusión es cierta. Para comprobar una forma, busca un caso con premisas verdaderas y conclusión falsa.",e:["Si estudio, apruebo. Estudié ⊢ apruebo.","Si hay fuego, hay humo. No hay humo ⊢ no hay fuego."],
q:["Si estudio, apruebo. No aprobé. ¿Qué se concluye?",["No estudié","Estudié poco","Nada"],0,["Modus tollens: negar el consecuente niega el antecedente.","«Poco» no aparece en las premisas.","Sí se concluye: si hubiera estudiado, habría aprobado."]],
p:["Si estudio, apruebo. Aprobé. ¿Qué se concluye?",["Estudié","No se sigue nada seguro","No estudié"],1,["Afirmar el consecuente es falacia: pudiste aprobar por otra vía.","Hay otras formas de aprobar; la conclusión no es necesaria.","Tampoco se sigue; tu premisa no dice «solo si»."]]},
{id:"ind",i:"📈",n:"Lógica inductiva",c:"Inducir es generalizar desde casos observados a una regla probable.",d:["Muestra: los casos observados","Generalización: la regla propuesta","Fuerza: depende del tamaño y la representatividad"],f:"La conclusión nunca es segura: un solo contraejemplo la refuta. Mejora con más casos y más variados.",e:["Cada mañana el sol sale: saldrá mañana.","Probé 3 restaurantes del barrio y fueron malos: ¿todos lo son?"],
q:["Viste 50 cisnes y todos eran blancos. ¿Qué es razonable concluir?",["Probablemente los cisnes son blancos, abierto a contraejemplos","Todos los cisnes son blancos con certeza","Ningún cisne puede ser negro"],0,["Conclusión probable y revisable: eso es inducir bien.","La certeza no existe en la inducción.","Eso es una afirmación absoluta no respaldada."]],
p:["Preguntas a 10 amigos: 9 aman el fútbol. Afirmas «el 90% del país lo ama». ¿Qué falla?",["Muestra pequeña y sesgada","Nada, 90% es muy alto","Es una deducción válida"],0,["Pocos casos y todos de tu círculo.","Un porcentaje alto no corrige una mala muestra.","Es inducción, y débil."]]},
{id:"abd",i:"🔦",n:"Lógica abductiva",c:"Abducir es proponer la mejor explicación para un hecho sorprendente.",d:["Hecho observado","Hipótesis candidatas","Criterio: simplicidad y poder explicativo"],f:"Parte del efecto y busca causas posibles; la conclusión es provisional y se prueba con nuevas observaciones.",e:["Piso mojado: ¿lluvia por la ventana o tubería?","Tu móvil no carga: ¿cable, enchufe o puerto?"],
q:["Llegas a casa y hay agua en el piso de la cocina. ¿Mejor primera hipótesis?",["Fuga o derrame cercano","Un meteorito","Alguien lo hizo por maldad"],0,["Simple, común y comprobable.","Explica el hecho, pero requiere suposiciones extraordinarias.","Requiere agregar intención sin evidencia."]],
p:["Tu planta se seca. Hipótesis: poco riego o demasiado sol. ¿Qué haces?",["Cambiar una variable a la vez","Cambiar todo a la vez","Elegir una al azar y olvidarte"],0,["Así sabrás cuál explicación funciona.","Si mejora, no sabrás por qué.","Una hipótesis sin probar no es conocimiento."]]},
{id:"cri",i:"🔍",n:"Pensamiento crítico",c:"Es evaluar afirmaciones según evidencia, fuente y razonamiento antes de aceptarlas.",d:["Fuente: ¿quién lo dice y por qué?","Evidencia: ¿qué datos hay?","Alternativas: ¿qué otra explicación cabe?"],f:"Se sospecha de afirmaciones extraordinarias y se contrasta con fuentes independientes.",e:["Un anuncio dice «los expertos lo recomiendan».","Un titular sin enlace al estudio."],
q:["Un anuncio dice «médicos recomiendan este jarabe». ¿Qué preguntas primero?",["¿Cuántos médicos, cuáles y quién pagó?","¿Es una marca famosa?","¿Se ve profesional?"],0,["Mide el peso real de la afirmación.","La fama no es evidencia.","La apariencia no es evidencia."]],
p:["Un estudio financiado por la empresa del producto concluye que funciona. ¿Qué implica?",["Posible conflicto de interés; buscar réplicas independientes","El estudio es falso","El estudio es cierto"],0,["No lo descarta, pero pide corroboración.","Rechazarlo sin analizar también es falacia.","Aceptarlo sin más ignora el sesgo posible."]]},
{id:"fal",i:"⚠️",n:"Falacias lógicas",c:"Una falacia es un error de razonamiento que parece válido pero no lo es.",d:["Ad hominem: atacar a la persona","Pendiente resbaladiza: exagerar cadenas de efectos","Falso dilema: ofrecer solo dos opciones"],f:"Se detecta preguntando: ¿las premisas apoyan realmente la conclusión, o solo la hacen parecer atractiva?",e:["«No le creas, ni terminó la universidad».","«O estás conmigo o contra mí»."],
q:["«No deberías creerle sobre economía, ni siquiera terminó la universidad». ¿Qué falacia es?",["Ad hominem","Pendiente resbaladiza","Falso dilema"],0,["Ataca a la persona, no al argumento.","No hay cadena de consecuencias.","No hay dos opciones forzadas."]],
p:["«Si dejamos faltar un día, pronto nadie vendrá nunca». ¿Qué falacia es?",["Pendiente resbaladiza","Ad hominem","Petición de principio"],0,["Salta a un extremo sin pruebas intermedias.","No ataca a nadie.","No supone la conclusión en las premisas."]]},
{id:"mat",i:"➗",n:"Pensamiento matemático",c:"Es razonar con cantidades y relaciones, verificando cada paso en lugar de confiar en la intuición.",d:["Datos y relaciones","Modelo: ecuación o esquema","Verificación del resultado"],f:"La intuición rápida suele fallar. Se traduce el problema a relaciones y se comprueba.",e:["Descuentos sucesivos.","Proporciones: doble de personas, mitad de tiempo."],
q:["3 máquinas hacen 3 piezas en 3 min. ¿Cuánto tardan 100 máquinas en hacer 100 piezas?",["100 min","3 min","1 min"],1,["Intuición engañosa: cada máquina hace 1 pieza en 3 min.","Cada máquina tarda 3 min en su pieza; todas trabajan a la vez.","No hay base para esa cifra."]],
p:["Bate y pelota cuestan 1,10 en total. El bate cuesta 1 más que la pelota. ¿Cuánto cuesta la pelota?",["0,10","0,05","0,15"],1,["Entonces el bate costaría 1,10 y el total 1,20.","x + (x + 1) = 1,10 → x = 0,05.","El total sería 1,30."]]},
{id:"abs",i:"🧠",n:"Pensamiento abstracto",c:"Es reconocer estructuras y reglas independientemente de su contenido concreto.",d:["Elementos","Relación o regla","Aplicación de la regla"],f:"Se busca qué se repite o cambia de forma constante y se prueba la regla.",e:["2, 4, 8, 16: se duplica.","Mano es a guante como pie es a zapato."],
q:["2, 6, 12, 20, … ¿qué sigue?",["28","30","32"],1,["Las diferencias son 4, 6, 8, 10: no 8.","Diferencias +4, +6, +8, +10 → 30.","Rompe el patrón de diferencias."]],
p:["Regla: ▲→■, ■→●, ●→▲. Aplicas la regla dos veces a ▲. ¿Resultado?",["●","■","▲"],0,["▲→■→●.","Es el resultado tras una sola aplicación.","Serían tres aplicaciones."]]},
{id:"cau",i:"🔗",n:"Relaciones causales",c:"Causa y correlación no son lo mismo: que dos cosas varíen juntas no prueba que una cause la otra.",d:["Correlación","Variable confusora","Dirección causal"],f:"Para afirmar causa se descartan terceras variables, se verifica el orden temporal y se busca mecanismo.",e:["Helados y ahogamientos suben en verano.","Quien duerme con zapatos amanece con dolor de cabeza."],
q:["Las ventas de helado y los ahogamientos suben juntos. ¿Los helados causan ahogamientos?",["No; el calor explica ambos","Sí","Los ahogamientos causan helados"],0,["Una causa común produce ambos efectos.","Correlación no es causalidad.","Inventa una dirección sin evidencia."]],
p:["Quien duerme con zapatos amanece con dolor de cabeza. ¿Mejor explicación alternativa?",["Dormir con zapatos causa dolor","Probablemente se acostaron ebrios","Es pura casualidad"],1,["Ignora la variable confusora.","El alcohol explica ambos hechos.","Descartarlo sin analizar es una conclusión apresurada."]]},
{id:"res",i:"🛠️",n:"Resolución de problemas",c:"Es un método: entender, planear, ejecutar y revisar.",d:["Definir qué se pide y qué se sabe","Dividir en partes","Probar y verificar"],f:"Quien resuelve bien dedica tiempo a entender antes de actuar y aísla variables.",e:["Fallo del wifi: ¿un dispositivo o todos?","Un trayecto con varias paradas."],
q:["Ante un problema nuevo, ¿qué paso va primero?",["Definir qué se pide y qué se sabe","Probar soluciones al azar","Buscar la respuesta final"],0,["Sin eso no sabes si resuelves el problema correcto.","Puede funcionar, pero sin aprender nada.","Es memorizar, no razonar."]],
p:["Tu wifi falla. ¿Mejor estrategia?",["Aislar: ¿falla un dispositivo o todos?","Comprar otro router","Reiniciar todo sin observar"],0,["Reduce el espacio de causas posibles.","Gastas antes de diagnosticar.","Puede arreglarlo, pero no sabrás por qué."]]},
{id:"arg",i:"🗣️",n:"Argumentación",c:"Argumentar es sostener una conclusión con razones que otros pueden evaluar.",d:["Tesis","Razones y evidencia","Objeciones y respuestas"],f:"Un buen argumento anticipa objeciones; refutar es atacar premisas o inferencia, no a la persona.",e:["«Usa casco: reduce lesiones graves».","Refutar: ¿la premisa es falsa o no apoya la tesis?"],
q:["¿Cuál es un argumento sólido?",["«Usa casco: reduce lesiones graves en caídas y cuesta poco»","«Usa casco porque lo digo yo»","«Usa casco porque todos lo usan»"],0,["Da razones verificables.","Apela a la autoridad sin razones.","Apela a la mayoría, no a la verdad."]],
p:["Para refutar un argumento, ¿qué conviene atacar?",["Premisas o inferencia","A quien lo dice","Su tono"],0,["Ahí está su fuerza lógica.","Es ad hominem.","El tono no afecta la validez."]]}
];
const X={
fun:[["Premisas: Ningún reptil es mamífero. Todas las serpientes son reptiles. ¿Qué se sigue?",["Ninguna serpiente es mamífero","Algunas serpientes son mamíferos","Todos los mamíferos son serpientes"],0,["Las serpientes están dentro de «reptiles», que excluye a los mamíferos.","Contradice la primera premisa.","No se deduce nada sobre todos los mamíferos."]],
["«Todos los políticos mienten; Ana es política; luego Ana miente». ¿Es válido y sólido?",["Válido, pero la primera premisa es dudosa","Inválido","Sólido porque es válido"],0,["La forma es correcta; la solidez exige premisas verdaderas.","Tiene la misma forma que el caso de Max: válida.","Validez no implica solidez."]],
["Algunos estudiantes son músicos. Todos los músicos practican. ¿Qué se sigue?",["Algunos estudiantes practican","Todos los estudiantes practican","Ningún estudiante practica"],0,["Los estudiantes que son músicos practican.","«Algunos» no se vuelve «todos».","Contradice las premisas."]]],
pro:[["Si p es verdadera y q falsa, ¿cuánto vale p ∨ q?",["Verdadera","Falsa","Depende"],0,["Basta una verdadera en una disyunción.","Solo es falsa si ambas lo son.","Los valores están dados."]],
["¿Qué expresión equivale a ¬(p ∧ q)?",["¬p ∨ ¬q","¬p ∧ ¬q","p ∨ q"],0,["Ley de De Morgan.","Eso equivale a ¬(p ∨ q).","Con p y q verdaderas difieren."]],
["«No es cierto que llueva y haga frío». ¿Cuándo es verdadera?",["Si al menos una de las dos es falsa","Solo si ambas son falsas","Solo si ambas son verdaderas"],0,["Basta que falle una para negar la conjunción.","Es suficiente, pero no necesario.","Entonces la conjunción sería verdadera y su negación falsa."]]],
ded:[["Todos los A son B. Todos los B son C. ¿Qué se sigue?",["Todos los A son C","Todos los C son A","Algunos C no son B"],0,["Se encadenan las inclusiones A⊂B⊂C.","Invierte la relación.","No hay base para eso."]],
["O voy al cine o a casa. No voy a casa. ¿Qué se concluye?",["Voy al cine","No voy al cine","Nada"],0,["Silogismo disyuntivo: se descarta una opción.","Contradice la disyunción.","Sí se concluye algo."]],
["Si hay corte, no hay luz. Hay luz. ¿Qué se concluye?",["No hay corte","Hay corte","Nada"],0,["Modus tollens: negar el consecuente.","Contradice la premisa.","Sí se concluye algo."]]],
ind:[["Las 5 veces que probaste ese café te cayó mal. ¿Conclusión inductiva razonable?",["Probablemente te cae mal","Te cae mal con certeza","Le cae mal a todos"],0,["Regla probable y revisable.","La inducción no da certeza.","Generaliza de ti a todos."]],
["¿Qué fortalece una generalización inductiva?",["Más casos y más variados","Casos muy parecidos entre sí","Repetirla con más fuerza"],0,["Reducen el sesgo de la muestra.","Casos iguales no amplían el alcance.","Insistir no es evidencia."]],
["Tu equipo ganó los 3 partidos con camiseta roja. ¿Qué concluyes?",["Muestra mínima: no se justifica atribuirlo a la camiseta","La camiseta roja da victorias","El rojo es mágico"],0,["Tres casos no bastan ni descartan otras causas.","Salto sin evidencia suficiente.","Explicación sin sustento."]]],
abd:[["Tu vecino sale con maleta y taxi a las 5 a. m. ¿Mejor hipótesis?",["Va de viaje","Es un fugitivo","Es un espía"],0,["Explica el hecho con menos suposiciones.","Añade suposiciones sin evidencia.","Añade suposiciones sin evidencia."]],
["Dos hipótesis explican igual un hecho. ¿Qué criterio ayuda a elegir?",["La que requiere menos suposiciones y se puede comprobar","La más dramática","La que dijo alguien con autoridad"],0,["Simplicidad y verificabilidad.","El drama no es evidencia.","La autoridad no sustituye la comprobación."]],
["El wifi falla solo en tu cuarto. ¿Hipótesis más útil?",["Señal débil por distancia u obstáculos","El proveedor cortó todo el servicio","Un virus global"],0,["Explica el patrón local y se comprueba moviéndote.","Contradice que funcione en otros cuartos.","No explica por qué es local."]]],
cri:[["«Un estudio lo confirma», sin decir quién, cuándo ni cuántos. ¿Qué haces?",["Pedir fuente y datos antes de creerlo","Creerlo","Descartarlo sin mirar nada más"],0,["Verificas antes de aceptar.","Aceptas sin evidencia.","Rechazar sin analizar también es sesgo."]],
["Una noticia te indigna y confirma lo que ya pensabas. ¿Qué precaución aplicas?",["Contrastar fuentes y vigilar el sesgo de confirmación","Compartirla ya","Ignorarla"],0,["Lo que coincide con tus ideas es lo que menos revisas.","Compartir sin verificar amplifica errores.","Ignorar no evalúa nada."]],
["«El 80% está satisfecho», según una encuesta en la web de la marca. ¿Problema?",["Muestra autoseleccionada","Ninguno","80% es poco"],0,["Responden quienes ya se interesan por la marca.","Hay un sesgo evidente.","La cifra no es el problema."]]],
fal:[["«Todos lo usan, así que es bueno». ¿Qué falacia es?",["Apelación a la mayoría","Ad hominem","Falso dilema"],0,["Popularidad no prueba verdad.","No ataca a nadie.","No limita a dos opciones."]],
["«O apoyas esta ley o no te importa el país».",["Falso dilema","Pendiente resbaladiza","Petición de principio"],0,["Presenta solo dos opciones.","No hay cadena de consecuencias.","No supone la conclusión."]],
["«Esa dieta funciona porque la recomienda un actor famoso».",["Apelación a una autoridad irrelevante","Ad hominem","Falso dilema"],0,["Su fama no es experiencia en nutrición.","No ataca a nadie.","No hay dos opciones forzadas."]]],
mat:[["Un artículo sube 20% y luego baja 20%. ¿Vuelve a su precio?",["No, queda 4% menos","Sí","Queda 4% más"],0,["1,2 × 0,8 = 0,96.","Los porcentajes se aplican sobre bases distintas.","Sería 1,04: no coincide."]],
["Un nenúfar duplica su área cada día y cubre el lago el día 48. ¿Cuándo cubre la mitad?",["Día 47","Día 24","Día 40"],0,["Un día antes tenía la mitad.","Es crecimiento exponencial, no lineal.","Tendría 1/256 del lago."]],
["5 personas tardan 10 h en una tarea. ¿Cuánto tardan 10 (mismo ritmo)?",["5 h","20 h","10 h"],0,["Doble de personas, mitad de tiempo.","Sería con menos personas.","Más personas sí cambian el tiempo."]]],
abs:[["1, 1, 2, 3, 5, 8, … ¿qué sigue?",["13","11","12"],0,["Cada término suma los dos anteriores.","5+8 no da 11.","5+8 no da 12."]],
["Rojo→verde→azul→rojo… ¿Qué color es el 10.º (rojo es el 1.º)?",["Rojo","Verde","Azul"],0,["El ciclo es de 3: 10 deja resto 1.","Sería el 2.º, 5.º, 8.º…","Sería el 3.º, 6.º, 9.º…"]],
["Todo ▲ es ■, y algún ■ es ●. ¿Se sigue que algún ▲ es ●?",["No necesariamente","Sí","Ningún ▲ es ●"],0,["Los ■ que son ● podrían ser otros ■.","No hay garantía de coincidencia.","Tampoco se sigue que ninguno lo sea."]]],
cau:[["Quienes toman vitaminas viven más. ¿Qué dudas primero?",["¿Ya cuidan más su salud?","¿Son caras?","¿Saben bien?"],0,["Posible variable confusora.","No afecta la causalidad.","No afecta la causalidad."]],
["Cambiaste de pastilla y mejoraste, pero también dormiste más. ¿Qué concluyes?",["No puedes atribuirlo solo a la pastilla","La pastilla funciona","El sueño no influye"],0,["Hay dos cambios a la vez.","Ignoras el sueño.","Lo descartas sin pruebas."]],

res:[["Tienes 3 tareas con distinta urgencia e importancia. ¿Qué haces?",["Clasificarlas antes de empezar","Hacer la más fácil","Hacer la primera que llegó"],0,["Planear evita esfuerzo mal dirigido.","Facilidad no es prioridad.","Orden de llegada no es prioridad."]],

["Para anticipar objeciones a tu tesis, ¿qué haces?",["Pensar el mejor contraargumento y responderlo","Ignorarlas","Atacar al crítico"],0,["Fortalece tu argumento.","Te deja vulnerable.","Es ad hominem."]]]
};
M.forEach(m=>{const x=X[m.id];m.Q=[m.q,x[0],x[1]];m.P=[m.p,x[2]]});
const $=s=>document.querySelector(s),esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let S=JSON.parse(localStorage.getItem('lg')||'{"m":{},"e":[]}'),tab='home',L=null,LB={e:'(p → q) ∧ p',g:''};
const save=()=>localStorage.setItem('lg',JSON.stringify(S)),st=id=>S.m[id]||(S.m[id]={a:0,t:0}),pc=m=>{const s=st(m.id);return s.t?s.a/s.t:0};
const tot=()=>Object.values(S.m).reduce((x,y)=>[x[0]+y.a,x[1]+y.t],[0,0]),acc=()=>{const[a,t]=tot();return t?Math.round(100*a/t):0};
const lvl=()=>{const t=tot()[1],a=acc();return t<4?'Principiante':a>=80?'Avanzado':a>=55?'Intermedio':'Principiante'};
const dom=m=>{const s=st(m.id);return s.t>=2&&s.a/s.t>=.75};
const nxt=()=>M.find(m=>!st(m.id).t)||M.slice().sort((x,y)=>pc(x)-pc(y))[0];
const go=t=>{tab=t;L=null;render();scrollTo(0,0)};
const openL=id=>{const m=M.find(x=>x.id==id),s=st(m.id),e=((s.k||0)+(dom(m)?1:0))%3;L={m,s:0,sel:-1,txt:'',r:[0,0],o:[],P:[m.Q[e],m.P[(e+1)%2]]};render();scrollTo(0,0)};
const step=n=>{L.s=n;L.sel=-1;L.txt='';render();scrollTo(0,0)};
const bar=p=>`<div class=bar><i style="width:${Math.round(p*100)}%"></i></div>`;
function home(){const n=nxt(),d=M.filter(dom).length;return`<h1>Lógica</h1><p class=s>Aprende a pensar, no a memorizar.</p>
<div class=stats style="margin-top:14px"><div class=card><b>${acc()}%</b><div class=s>Precisión</div></div><div class=card><b>${d}/12</b><div class=s>Dominados</div></div><div class=card><b style="font-size:15px">${lvl()}</b><div class=s>Nivel</div></div></div>
<div class=card><div class=s>${st(n.id).t?'Para reforzar':'Siguiente lección'}</div><div class=row style="margin-top:6px"><span class=ico>${n.i}</span><div><b>${n.n}</b></div></div><button class=btn onclick="openL('${n.id}')">Empezar</button></div>
<button class="btn sec" onclick="go('lab')">🧪 Ir al laboratorio de razonamiento</button>`}
function map(){return`<h1>Mapa de módulos</h1><p class=s>Cada módulo se adapta a tu desempeño.</p>`+M.map(m=>`<div class=card onclick="openL('${m.id}')"><div class=row><span class=ico>${m.i}</span><div><b>${m.n}</b>${bar(pc(m))}<div class=s>${st(m.id).t?Math.round(pc(m)*100)+'% de acierto':'Sin empezar'}${dom(m)?' · ✅ dominado':''}</div></div></div></div>`).join('')}
function lesson(){const m=L.m,s=L.s,N=['Concepto','Descomposición','Funcionamiento','Ejemplos','Ejercicio','Evaluación','Corrección','Aplicación'];
let h=`<div class=top><button class=back onclick="L=null;render()">←</button><div><b>${m.i} ${m.n}</b><div class=s>${s<8?(s+1)+'/8 · '+N[s]:'Resumen'}</div></div></div>${bar(s/8)}`;
const nx=(t,n)=>`<button class=btn onclick="step(${n??s+1})">${t||'Continuar'}</button>`;
if(s==0)h+=`<div class=card><h2>Concepto</h2>${m.c}</div>`+nx();
if(s==1)h+=`<div class=card><h2>Componentes</h2><ul>${m.d.map(x=>`<li>${x}</li>`).join('')}</ul></div>`+nx();
if(s==2)h+=`<div class=card><h2>Cómo funciona</h2>${m.f}</div><div class=card><b>Piénsalo:</b> ¿podrías inventar tu propio caso donde esto se cumpla y otro donde no?</div>`+nx();
if(s==3)h+=`<div class=card><h2>Ejemplos</h2><ul>${m.e.map(x=>`<li>${x}</li>`).join('')}</ul></div>`+nx('Ir al ejercicio');
if(s==4||s==7){const i=s==7?1:0,P=L.P[i];if(!L.o[i])L.o[i]=[0,1,2].sort(()=>Math.random()-.5);
h+=`<div class=card><h2>${i?'Aplicación':'Ejercicio'}</h2>${P[0]}<p class=s style="margin-top:10px">Primero escribe tu razonamiento: ¿qué premisas usas y a qué llegas?</p><textarea rows=3 oninput="L.txt=this.value" placeholder="Mi razonamiento…">${esc(L.txt)}</textarea></div>`+L.o[i].map((oi,k)=>`<button class="btn opt ${L.sel==k?'sel':''}" onclick="L.sel=${k};render()">${P[1][oi]}</button>`).join('')+`<p id=msg class=s style="margin-top:8px"></p><button class=btn onclick="sub(${i})">Comprobar</button>`}
if(s==5){const r=L.r[0],P=L.P[0];h+=`<div class=card><h2>Evaluación</h2><b class=${r.ok?'g':'r'}>${r.ok?'✔ Acertaste':'✘ Aún no'}</b><p style="margin:8px 0"><span class=s>Tu respuesta:</span> ${P[1][r.ch]}</p><p><span class=s>Análisis:</span> ${P[3][r.ch]}</p><p class=s style="margin-top:8px">Tu razonamiento: «${esc(r.txt)}»</p></div>`+nx('Ver corrección')}
if(s==6){const P=L.P[0];h+=`<div class=card><h2>Corrección</h2><p class=s>Revisa cada opción y compara con tu razonamiento: ¿qué paso omitiste?</p></div>`+P[1].map((o,k)=>`<div class="card" style="border-color:var(--${k==P[2]?'ok':'ln'})"><b>${k==P[2]?'✔ ':''}${o}</b><div class=s>${P[3][k]}</div></div>`).join('')+nx('Aplicar lo aprendido')}
if(s==8){const a=L.r[0].ok,b=L.r[1].ok;h+=`<div class=card><h2>Resumen</h2><p>Ejercicio: <b class=${a?'g':'r'}>${a?'✔':'✘'}</b> · Aplicación: <b class=${b?'g':'r'}>${b?'✔':'✘'}</b></p><p style="margin-top:8px">${b?(a?'Dominas el concepto. Pasa al siguiente módulo.':'Aprendiste de la corrección: lo aplicaste bien.'):'Repasa el concepto: explica con tus palabras por qué fallaste y repite.'}</p></div><button class=btn onclick="openL('${m.id}')">Repetir</button><button class="btn sec" onclick="go('map')">Volver al mapa</button>`}
return h}
function sub(i){if(L.sel<0||L.txt.trim().length<8)return $('#msg').textContent='Elige una opción y escribe tu razonamiento (mín. 8 caracteres).';
const m=L.m,P=L.P[i],ch=L.o[i][L.sel],ok=ch==P[2],s=st(m.id);s.t++;if(ok)s.a++;if(i)s.k=(s.k||0)+1;
if(!ok)S.e.push({m:m.n,q:P[0],mine:P[1][ch],right:P[1][P[2]],why:P[3][ch],d:Date.now()});save();L.r[i]={ok,ch,txt:L.txt};step(i?8:5)}
function labView(){return`<h1>Laboratorio</h1><p class=s>Escribe una expresión con p, q, r (usa paréntesis). Predice antes de calcular.</p><div class=card><input value="${LB.e}" oninput="LB.e=this.value"><div class=chips>${['¬','∧','∨','→','↔','(',')','p','q','r'].map(x=>`<button class=chip onclick="LB.e+='${x}';render()">${x}</button>`).join('')}</div><h2>Tu predicción</h2><div class=chips>${['Tautología','Contradicción','Contingencia'].map(x=>`<button class="chip ${LB.g==x?'on':''}" onclick="LB.g='${x}';render()">${x}</button>`).join('')}</div><button class=btn onclick=calc()>Calcular tabla</button><div id=out></div></div>`}
function calc(){const o=$('#out');if(!LB.g)return o.innerHTML='<p class=s>Primero elige tu predicción.</p>';
let x=LB.e.replace(/¬/g,'!').replace(/∧/g,'&&').replace(/∨/g,'||').replace(/↔/g,'<->').replace(/→/g,'->');const A='(!*\\w+|!*\\([^()]*\\))';
for(let i=0;i<9;i++)x=x.replace(new RegExp(A+'\\s*<->\\s*'+A),'(($1)==($2))').replace(new RegExp(A+'\\s*->\\s*'+A),'(!($1)||($2))');
if(!/^[pqr!&|()=\s]+$/.test(x))return o.innerHTML='<p class=r>Expresión no válida.</p>';
const v=['p','q','r'].filter(k=>new RegExp('\\b'+k+'\\b').test(x));let f;try{f=new Function('p','q','r','return !!('+x+')');f(0,0,0)}catch(e){return o.innerHTML='<p class=r>Expresión no válida.</p>'}
const rows=[];for(let n=0;n<1<<v.length;n++){const a={p:0,q:0,r:0};v.forEach((k,j)=>a[k]=(n>>(v.length-1-j))&1);rows.push([v.map(k=>a[k]),f(a.p,a.q,a.r)])}
const all=rows.every(r=>r[1]),none=rows.every(r=>!r[1]),res=all?'Tautología':none?'Contradicción':'Contingencia',t=b=>b?'<span class=g>V</span>':'<span class=r>F</span>';
o.innerHTML=`<table><tr>${v.map(k=>`<th>${k}</th>`).join('')}<th>Resultado</th></tr>${rows.map(r=>`<tr>${r[0].map(t).join('')?r[0].map(b=>`<td>${t(b)}</td>`).join(''):''}<td>${t(r[1])}</td></tr>`).join('')}</table><p style="margin-top:10px"><b>${res}</b> · ${res==LB.g?'<span class=g>Tu predicción fue correcta ✔</span>':'<span class=r>Tu predicción era '+LB.g+'. Revisa qué filas lo deciden.</span>'}</p>`}
function prog(){const[a,t]=tot(),d=M.filter(dom);return`<h1>Progreso</h1><div class=stats style="margin-top:14px"><div class=card><b>${acc()}%</b><div class=s>Precisión</div></div><div class=card><b>${t}</b><div class=s>Intentos</div></div><div class=card><b>${d.length}</b><div class=s>Dominados</div></div></div>
<h2>Conocimientos dominados</h2><div class=chips>${d.length?d.map(m=>`<span class="chip on">${m.i} ${m.n}</span>`).join(''):'<span class=s>Aún ninguno: acierta ≥75% en un módulo.</span>'}</div>
<h2>Por módulo</h2>${M.map(m=>`<div class=s>${m.i} ${m.n}</div>${bar(pc(m))}`).join('')}
<h2>Historial de errores</h2>${S.e.length?S.e.slice(-20).reverse().map(e=>`<div class=card><div class=s>${e.m} · ${new Date(e.d).toLocaleDateString()}</div><b>${e.q}</b><p>Tú: <span class=r>${e.mine}</span></p><p>Correcta: <span class=g>${e.right}</span></p><p class=s>${e.why}</p></div>`).join(''):'<p class=s>Sin errores registrados.</p>'}
<button class="btn sec" onclick="if(confirm('¿Borrar todo el progreso?')){S={m:{},e:[]};save();render()}">Borrar datos</button>`}
function render(){$('main').innerHTML=L?lesson():({home,map,lab:labView,prog})[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
render();
</script></body></html>
